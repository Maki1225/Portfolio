<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d89eaa"/>
      <stop offset="1" stop-color="#bd7d8c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#765b55" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="28" fill="#f8e8ec"/>
  <ellipse cx="400" cy="228" rx="335" ry="176" fill="url(#felt)"/>
  <ellipse cx="400" cy="228" rx="311" ry="153" fill="none" stroke="#f8e8ec" stroke-opacity=".55" stroke-width="2"/>

  <g filter="url(#shadow)" transform="rotate(-12 330 225)">
    <rect x="244" y="106" width="160" height="230" rx="15" fill="#fffdfb"/>
    <text x="268" y="150" fill="#765b55" font-family="Georgia,serif" font-size="36" font-weight="700">A</text>
    <text x="268" y="184" fill="#765b55" font-family="Georgia,serif" font-size="30">♠</text>
    <text x="324" y="260" fill="#765b55" font-family="Georgia,serif" font-size="92" text-anchor="middle">♠</text>
    <text x="380" y="310" fill="#765b55" font-family="Georgia,serif" font-size="36" font-weight="700" text-anchor="end">A</text>
  </g>

  <g filter="url(#shadow)" transform="rotate(12 470 225)">
    <rect x="396" y="106" width="160" height="230" rx="15" fill="#fffdfb"/>
    <text x="420" y="150" fill="#bd7180" font-family="Georgia,serif" font-size="36" font-weight="700">K</text>
    <text x="420" y="184" fill="#bd7180" font-family="Georgia,serif" font-size="30">♥</text>
    <text x="476" y="260" fill="#bd7180" font-family="Georgia,serif" font-size="92" text-anchor="middle">♥</text>
    <text x="532" y="310" fill="#bd7180" font-family="Georgia,serif" font-size="36" font-weight="700" text-anchor="end">K</text>
  </g>

  <g fill="#f8e8ec" stroke="#fffdfb" stroke-width="3">
    <circle cx="142" cy="214" r="29"/>
    <circle cx="658" cy="214" r="29"/>
  </g>
  <g fill="none" stroke="#bd7d8c" stroke-width="4" stroke-dasharray="5 6">
    <circle cx="142" cy="214" r="20"/>
    <circle cx="658" cy="214" r="20"/>
